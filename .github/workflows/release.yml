# Mercury CD Pipeline - Generate Release
#
# Triggers: manual via workflow_dispatch (provide version).
#
# Steps:
#   1. Bump version strings + changelog, commit, push
#   2. Build unsigned Windows zip (debian container, mingw cross-compile)
#   3. Authenticode-sign the binaries (certum-signer container, jsign + SimplySign)
#   4. Create GitHub release with signed zip

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.9)'
        required: true
        type: string
      build_installer:
        description: 'Also build+sign the Windows installer (needs Wine+Inno in the signer container)'
        required: false
        default: false
        type: boolean

jobs:
  # ---- Version bump + commit ----
  bump:
    name: Bump version to v${{ inputs.version }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 10
    outputs:
      version: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Invalid version: ${{ inputs.version }}"; exit 1; }

      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates git gh

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: mercuryv2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git config
        run: |
          git config --global --add safe.directory /__w/mercury/mercury
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Collect PR titles since last tag
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          LAST_TAG_DATE=$(git log -1 --format="%cI" "${LAST_TAG}")
          PR_TITLES=$(gh pr list --repo Rhizomatica/mercury --state merged --base mercuryv2 \
            --search "merged:>${LAST_TAG_DATE}" --limit 200 --json title,mergedAt \
            --jq 'sort_by(.mergedAt) | .[].title')
          PR_ENTRIES=""
          while IFS= read -r title; do
            [[ -z "$title" ]] && continue
            PR_ENTRIES="${PR_ENTRIES}  * ${title%.}.\n"
          done <<< "$PR_TITLES"
          { echo 'PR_ENTRIES<<EOF'; printf '%b' "$PR_ENTRIES"; echo 'EOF'; } >> "$GITHUB_ENV"

      - name: Bump version files
        run: |
          V="${{ inputs.version }}"
          D=$(date -R)
          { printf 'mercury (%s-1) unstable; urgency=medium\n\n  * Release %s.\n%b\n\n -- Rafael Diniz <rafael@riseup.net>  %s\n\n' "$V" "$V" "$PR_ENTRIES" "$D"; } | cat - debian/changelog > t && mv t debian/changelog
          sed -i 's/#define VERSION__ "[^"]*"/#define VERSION__ "'"$V"'"/' main.c
          sed -i 's/#define MERCURY_VERSION "[^"]*"/#define MERCURY_VERSION "'"$V"'"/' common/mercury_version.h
          sed -i 's/"Mercury [0-9]*\.[0-9]*\.[0-9]*"/"Mercury '"$V"'"/' mercury.1
          sed -i 's/#define MyAppVersion "[^"]*"/#define MyAppVersion "'"$V"'"/' windows-installer/installer.iss

      - name: Commit and push
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add debian/changelog main.c common/mercury_version.h mercury.1 windows-installer/installer.iss
          git commit -m "Updates for release ${{ inputs.version }}"
          git push origin mercuryv2

  # ---- Build unsigned Windows zip ----
  build:
    name: Build Windows zip
    needs: bump
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates build-essential git golang-go \
            gcc-mingw-w64-x86-64 mingw-w64-x86-64-dev mingw-w64-common zip

      - uses: actions/checkout@v4
        with: { ref: mercuryv2, fetch-depth: 1 }

      - name: Build Windows zip
        run: make windows-zip

      - name: Upload unsigned binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            mercury.exe
            windows-installer/mercury-ui.exe
            mercury-${{ inputs.version }}-w64-*.zip

  # ---- Sign Windows binaries (Certum SimplySign) ----
  sign:
    name: Sign Windows binaries
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reactiveui/certum-signer:latest
    timeout-minutes: 15
    steps:
      # Full checkout, not sparse: building the installer needs installer.iss,
      # LICENSE, the icon, mercury.ini.example and the vendored hamlib DLLs.
      - uses: actions/checkout@v4
        with: { ref: mercuryv2 }

      - name: Download unsigned binaries
        uses: actions/download-artifact@v4
        with: { name: windows-unsigned }

      - name: Sign binaries
        env:
          CERTUM_EMAIL:   ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: |
          code-signing/sign.sh mercury.exe windows-installer/mercury-ui.exe
          code-signing/sign-logout.sh

      - name: Verify signatures
        run: |
          # osslsigncode is not baked into the certum-signer image; install it
          # for the verification pass (the signing itself uses jsign).
          command -v osslsigncode >/dev/null || \
            { apt-get update && apt-get install -y --no-install-recommends osslsigncode; }
          for f in mercury.exe windows-installer/mercury-ui.exe; do
            osslsigncode verify "$f" || { echo "::error::Signature verification failed for $f"; exit 1; }
          done

      # ---- Installer: pack the SIGNED payloads, then sign the installer ----
      # Order matters. ISCC packs whatever is staged, so signing only the
      # finished Setup.exe would ship a signed installer that installs unsigned
      # programs. The payloads above are already signed; stage them without
      # rebuilding (windows-installer-stage has no toolchain dependency, and a
      # rebuild here would discard those signatures anyway).
      - name: Install Inno Setup (Wine)
        if: ${{ inputs.build_installer }}
        env:
          INNO_URL:    https://wiki.hermes.radio/reports/inno-setup-6.7.3-wine.tar.gz
          INNO_SHA256: 4c9c92249663f201a33bf194c0cd37e01c60540e299c771f3626411ef463c884
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends wine ca-certificates curl
          # A prepared Inno Setup tree rather than running its GUI installer under
          # Wine on every release: no display needed, no silent-install that can
          # half-succeed, and the exact same compiler every time.  ISCC is a
          # console program and needs no registry state — the tree alone is
          # enough (verified by compiling from a virgin WINEPREFIX).
          # TLS is verified (the host serves its full chain) and the sha256
          # pins the exact bytes: the transport says where the tarball came
          # from, the checksum says it is the one this workflow was built
          # against. A mismatch fails the build rather than signing whatever
          # turned up.
          curl -fsSLo /tmp/inno.tar.gz "$INNO_URL"
          echo "${INNO_SHA256}  /tmp/inno.tar.gz" | sha256sum -c -
          wineboot -i
          PF="$HOME/.wine/drive_c/Program Files (x86)"
          mkdir -p "$PF"
          tar xzf /tmp/inno.tar.gz -C "$PF/"
          ISCC_PATH="$PF/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC_PATH" ] || { echo "::error::Inno Setup tree missing ISCC.exe"; exit 1; }
          echo "ISCC_PATH=$ISCC_PATH" >> "$GITHUB_ENV"

      - name: Build and sign the installer
        if: ${{ inputs.build_installer }}
        env:
          CERTUM_EMAIL:   ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: |
          set -eu
          make windows-installer-stage
          wine "$ISCC_PATH" windows-installer/installer.iss
          SETUP=$(ls Mercury_*_Setup.exe | head -1)
          [ -n "$SETUP" ] || { echo "::error::ISCC produced no installer"; exit 1; }
          code-signing/sign.sh "$SETUP"
          code-signing/sign-logout.sh
          osslsigncode verify "$SETUP" || {
            echo "::error::Installer signature verification failed"; exit 1; }
          echo "SETUP_EXE=$SETUP" >> "$GITHUB_ENV"

      - name: Upload signed installer
        if: ${{ inputs.build_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-signed
          path: Mercury_*_Setup.exe

      - name: Re-pack signed zip
        run: |
          ZIP=$(ls mercury-${{ inputs.version }}-w64-*.zip | head -1)
          mkdir -p dist/mercury-${{ inputs.version }}
          cp mercury.exe dist/mercury-${{ inputs.version }}/
          cp windows-installer/mercury-ui.exe dist/mercury-${{ inputs.version }}/
          cp mercury.ini.example dist/mercury-${{ inputs.version }}/
          cd dist && zip -9r "../${ZIP}" "mercury-${{ inputs.version }}" && cd ..
          rm -rf dist

      - name: Upload signed zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: mercury-${{ inputs.version }}-w64-*.zip

  # ---- Create GitHub release ----
  release:
    name: Create GitHub release
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download signed zip
        uses: actions/download-artifact@v4
        with: { name: windows-signed }

      - name: Download signed installer
        if: ${{ inputs.build_installer }}
        uses: actions/download-artifact@v4
        with: { name: windows-installer-signed }

      - name: Create release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          ZIP=$(ls mercury-${{ inputs.version }}-w64-*.zip)
          ASSETS="./${ZIP}"
          # The installer is opt-in (build_installer); attach it only if present,
          # so a release without it still publishes cleanly.
          SETUP=$(ls Mercury_*_Setup.exe 2>/dev/null | head -1 || true)
          [ -n "$SETUP" ] && ASSETS="$ASSETS ./${SETUP}"
          gh release create "v${{ inputs.version }}" $ASSETS \
            --repo Rhizomatica/mercury --target mercuryv2 --generate-notes \
            --title "Mercury ${{ inputs.version }}"
