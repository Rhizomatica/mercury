# Mercury CD Pipeline - Generate Release
#
# Triggers: manual via workflow_dispatch (provide version).
#
# Steps:
#   1. Bump version strings + changelog, commit, push
#   2. Build unsigned Windows zip (debian container, mingw cross-compile)
#   3. Authenticode-sign the binaries (certum-signer container, jsign + SimplySign)
#   4. Create GitHub release with signed zip

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.9)'
        required: true
        type: string
      build_installer:
        description: 'Build+sign the Windows installer (untick to ship the zip only)'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build+sign+notarize the macOS universal .dmg'
        required: false
        default: true
        type: boolean

jobs:
  # ---- Version bump + commit ----
  bump:
    name: Bump version to v${{ inputs.version }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 10
    outputs:
      version: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Invalid version: ${{ inputs.version }}"; exit 1; }

      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends bash ca-certificates git gh

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: mercuryv2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git config
        run: |
          git config --global --add safe.directory /__w/mercury/mercury
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Collect PR titles since last tag
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          LAST_TAG_DATE=$(git log -1 --format="%cI" "${LAST_TAG}")
          PR_TITLES=$(gh pr list --repo Rhizomatica/mercury --state merged --base mercuryv2 \
            --search "merged:>${LAST_TAG_DATE}" --limit 200 --json title,mergedAt \
            --jq 'sort_by(.mergedAt) | .[].title')
          PR_ENTRIES=""
          while IFS= read -r title; do
            [[ -z "$title" ]] && continue
            PR_ENTRIES="${PR_ENTRIES}  * ${title%.}.\n"
          done <<< "$PR_TITLES"
          { echo 'PR_ENTRIES<<EOF'; printf '%b' "$PR_ENTRIES"; echo 'EOF'; } >> "$GITHUB_ENV"

      - name: Bump version files
        run: |
          V="${{ inputs.version }}"
          D=$(date -R)
          { printf 'mercury (%s-1) unstable; urgency=medium\n\n  * Release %s.\n%b\n\n -- Rafael Diniz <rafael@riseup.net>  %s\n\n' "$V" "$V" "$PR_ENTRIES" "$D"; } | cat - debian/changelog > t && mv t debian/changelog
          sed -i 's/#define VERSION__ "[^"]*"/#define VERSION__ "'"$V"'"/' main.c
          sed -i 's/#define MERCURY_VERSION "[^"]*"/#define MERCURY_VERSION "'"$V"'"/' common/mercury_version.h
          sed -i 's/"Mercury [0-9]*\.[0-9]*\.[0-9]*"/"Mercury '"$V"'"/' mercury.1
          sed -i 's/#define MyAppVersion "[^"]*"/#define MyAppVersion "'"$V"'"/' windows-installer/installer.iss

      - name: Commit and push
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add debian/changelog main.c common/mercury_version.h mercury.1 windows-installer/installer.iss
          # Idempotent: a re-run after a later job failed finds the bump already
          # committed, and `git commit` with nothing staged exits non-zero and
          # would fail the whole release for no reason.
          if git diff --cached --quiet; then
            echo "version files already at ${{ inputs.version }}; nothing to commit"
          else
            git commit -m "Updates for release ${{ inputs.version }}"
            git push origin mercuryv2
          fi

  # ---- Build unsigned Windows zip ----
  build:
    name: Build Windows zip
    needs: bump
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates build-essential git golang-go \
            gcc-mingw-w64-x86-64 mingw-w64-x86-64-dev mingw-w64-common zip

      - uses: actions/checkout@v4
        with: { ref: mercuryv2, fetch-depth: 1 }

      - name: Git config
        run: git config --global --add safe.directory /__w/mercury/mercury

      - name: Build Windows zip
        run: make windows-zip

      - name: Upload unsigned binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            mercury.exe
            windows-installer/mercury-ui.exe
            mercury-${{ inputs.version }}-w64-*.zip

  # ---- Sign Windows binaries (Certum SimplySign) ----
  sign:
    name: Sign Windows binaries
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reactiveui/certum-signer:latest
    timeout-minutes: 15
    steps:
      # Full checkout, not sparse: building the installer needs installer.iss,
      # LICENSE, the icon, mercury.ini.example and the vendored hamlib DLLs.
      - uses: actions/checkout@v4
        with: { ref: mercuryv2 }

      - name: Download unsigned binaries
        uses: actions/download-artifact@v4
        with: { name: windows-unsigned }

      # The signer image (Ubuntu 24.04 + SimplySign + jsign) ships unzip but not
      # zip, and no make or screenshot tool. Every one of those is used AFTER a
      # successful signing session — re-packing the zip, staging the installer,
      # photographing a failed login — so a missing one would burn the session
      # and fail the release at the last step. Install them before signing.
      - name: Install tools the signer image lacks
        run: |
          set -eu
          PKGS=""
          command -v zip    >/dev/null || PKGS="$PKGS zip"
          command -v make   >/dev/null || PKGS="$PKGS make"
          command -v import >/dev/null || PKGS="$PKGS imagemagick"
          if [ -n "$PKGS" ]; then
            apt-get update
            # shellcheck disable=SC2086
            apt-get install -y --no-install-recommends $PKGS
          fi

      - name: Sign binaries
        env:
          CERTUM_EMAIL:   ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: |
          # No logout here.  sign.sh reuses a live session ("session already
          # live -- reusing"), and the installer is signed later in this same
          # job.  Logging out in between forced a SECOND SimplySign login,
          # which is what failed on the 1.9.12 attempt: the first login worked,
          # the second never rendered its form ("login window did not appear",
          # with a Critical error dialog left on :99).  One login per job.
          # The teardown is the always() step at the end.
          # Retry per file: the SimplySign login is intermittently flaky --
          # "login window did not appear", with a Critical error dialog left
          # on :99 -- and a second attempt has been observed to come up
          # cleanly.  sign.sh records a failure for the file it was on, so
          # retry that file rather than the whole set (re-running a file that
          # already signed would add a second signature).
          for f in mercury.exe windows-installer/mercury-ui.exe; do
            ok=0
            for attempt in 1 2 3; do
              if code-signing/sign.sh "$f"; then ok=1; break; fi
              echo "::warning::signing $f failed (attempt $attempt), retrying"
              sleep 15
            done
            [ "$ok" = 1 ] || { echo "::error::could not sign $f"; exit 1; }
          done

      - name: Verify signatures
        run: |
          # osslsigncode is not baked into the certum-signer image; install it
          # for the verification pass (the signing itself uses jsign).
          command -v osslsigncode >/dev/null || \
            { apt-get update && apt-get install -y --no-install-recommends osslsigncode; }
          for f in mercury.exe windows-installer/mercury-ui.exe; do
            osslsigncode verify "$f" || { echo "::error::Signature verification failed for $f"; exit 1; }
          done

      # The zip is finished and banked BEFORE the installer is attempted.  The
      # two are independent (the installer stage reads mercury.exe and the
      # hamlib DLLs, never the zip or dist/), and the installer half is by far
      # the more fragile: it needs wine, a downloaded Inno tree and a second
      # use of the signing session.  Ordered this way, a failed installer
      # leaves a downloadable signed zip to release by hand instead of taking
      # the whole run's output down with it.
      - name: Re-pack signed zip
        run: |
          ZIP=$(ls mercury-${{ inputs.version }}-w64-*.zip | head -1)
          mkdir -p dist/mercury-${{ inputs.version }}
          cp mercury.exe dist/mercury-${{ inputs.version }}/
          cp windows-installer/mercury-ui.exe dist/mercury-${{ inputs.version }}/
          cp mercury.ini.example dist/mercury-${{ inputs.version }}/
          cd dist && zip -9r "../${ZIP}" "mercury-${{ inputs.version }}" && cd ..
          rm -rf dist

      - name: Upload signed zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: mercury-${{ inputs.version }}-w64-*.zip

      # ---- Installer: pack the SIGNED payloads, then sign the installer ----
      # Order matters. ISCC packs whatever is staged, so signing only the
      # finished Setup.exe would ship a signed installer that installs unsigned
      # programs. The payloads above are already signed; stage them without
      # rebuilding (windows-installer-stage has no toolchain dependency, and a
      # rebuild here would discard those signatures anyway).
      - name: Install Inno Setup (Wine)
        if: ${{ inputs.build_installer }}
        env:
          INNO_URL:    https://wiki.hermes.radio/reports/inno-setup-6.7.3-wine.tar.gz
          INNO_SHA256: 4c9c92249663f201a33bf194c0cd37e01c60540e299c771f3626411ef463c884
        run: |
          set -eu
          # ISCC.exe is a 32-bit program: without wine32 the loader reports
          # "it looks like wine32 is missing" and exits non-zero.  We are root
          # inside the signer container, so no sudo.
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends wine wine32:i386 ca-certificates curl
          # A prepared Inno Setup tree rather than running its GUI installer under
          # Wine on every release: no display needed, no silent-install that can
          # half-succeed, and the exact same compiler every time.  ISCC is a
          # console program and needs no registry state — the tree alone is
          # enough (verified by compiling from a virgin WINEPREFIX).
          # TLS is verified (the host serves its full chain) and the sha256
          # pins the exact bytes: the transport says where the tarball came
          # from, the checksum says it is the one this workflow was built
          # against. A mismatch fails the build rather than signing whatever
          # turned up.
          curl -fsSLo /tmp/inno.tar.gz "$INNO_URL"
          echo "${INNO_SHA256}  /tmp/inno.tar.gz" | sha256sum -c -
          # $HOME is /github/home in a container job and is not owned by the
          # user wine runs as ("refusing to create a configuration directory
          # there"), so give wine a prefix it owns.
          export WINEPREFIX=/tmp/wineprefix
          echo "WINEPREFIX=$WINEPREFIX" >> "$GITHUB_ENV"
          wineboot -i
          PF="$WINEPREFIX/drive_c/Program Files (x86)"
          mkdir -p "$PF"
          tar xzf /tmp/inno.tar.gz -C "$PF/"
          ISCC_PATH="$PF/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC_PATH" ] || { echo "::error::Inno Setup tree missing ISCC.exe"; exit 1; }
          echo "ISCC_PATH=$ISCC_PATH" >> "$GITHUB_ENV"

      - name: Build and sign the installer
        if: ${{ inputs.build_installer }}
        env:
          CERTUM_EMAIL:   ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: |
          set -eu
          make windows-installer-stage
          wine "$ISCC_PATH" windows-installer/installer.iss
          SETUP=$(ls Mercury_*_Setup.exe | head -1)
          [ -n "$SETUP" ] || { echo "::error::ISCC produced no installer"; exit 1; }
          code-signing/sign.sh "$SETUP"   # reuses the session opened above
          osslsigncode verify "$SETUP" || {
            echo "::error::Installer signature verification failed"; exit 1; }
          echo "SETUP_EXE=$SETUP" >> "$GITHUB_ENV"

      - name: Upload signed installer
        if: ${{ inputs.build_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-signed
          path: Mercury_*_Setup.exe

      # One login per job means one logout, and it has to happen even when a
      # step above failed -- otherwise a failed run leaves the cloud session
      # open.  always(), and never fail the job on the teardown itself.
      - name: Close the SimplySign session
        if: always()
        env:
          CERTUM_EMAIL:   ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: code-signing/sign-logout.sh || true

      # Screenshots and window lists live on the runner; without this they are
      # thrown away with the container, which is exactly when they are wanted.
      - name: Upload signing diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signing-diagnostics
          path: /tmp/mercury-signing-diag
          if-no-files-found: ignore

  # ---- macOS universal .dmg: build, sign (Developer ID), notarize, staple ----
  # Runs on macOS only because hdiutil builds the .dmg and is Apple-only.
  # Signing and notarization are rcodesign, not Apple's codesign/notarytool:
  # no keychain to unlock, and the same command works on a Linux box by hand.
  # See docs/MACOS-SIGNING.md.
  macos:
    name: Build and notarize macOS .dmg
    needs: bump
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: mercuryv2, fetch-depth: 1 }

      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }

      # Fail before spending 40 minutes on a build we could not ship.  An
      # unsigned .dmg on a release page is worse than no .dmg: it teaches
      # people to click through Gatekeeper.
      - name: Require signing credentials
        env:
          P12:   ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          PASS:  ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          NOTARY: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          # The password is deliberately NOT required.  PKCS#12 permits an
          # empty password, and protecting the .p12 with one adds nothing when
          # the certificate is already a bearer credential held in a secret
          # store -- so an empty MACOS_SIGN_P12_PASSWORD is a valid setup, and
          # demanding a non-empty one would fail a correct configuration.
          missing=
          [ -n "$P12" ]    || missing="$missing MACOS_SIGN_P12_BASE64"
          [ -n "$NOTARY" ] || missing="$missing MACOS_NOTARY_KEY_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing"
            echo "See docs/MACOS-SIGNING.md for how to create and set them."
            exit 1
          fi

      # rcodesign has no Homebrew formula, and `cargo install` would compile it
      # from source on every release.  Pinned pre-built binary + checksum: the
      # version is the one the Makefile documents as verified (0.28.0), and the
      # checksum means a replaced asset fails the job instead of signing with
      # something we did not intend.
      - name: Install fyne and rcodesign
        env:
          RCODESIGN_VERSION: '0.28.0'
          RCODESIGN_SHA256: 'fdad0c03e3a33ac7676c3641547f0cf9adad2cd52919033e3866b551bc9aae12'
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          TARBALL="apple-codesign-${RCODESIGN_VERSION}-macos-universal.tar.gz"
          curl -fsSLO "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${TARBALL}"
          echo "${RCODESIGN_SHA256}  ${TARBALL}" | shasum -a 256 -c -
          tar xzf "$TARBALL"
          mkdir -p "$HOME/.local/bin"
          mv apple-codesign-*/rcodesign "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rcodesign" --version

      # Written to the runner's temp dir, not the workspace, so they cannot be
      # picked up by a later packaging step or an artifact upload.
      - name: Materialise credentials
        env:
          P12:    ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          NOTARY: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$P12"    | base64 --decode > "$RUNNER_TEMP/developer_id.p12"
          printf '%s' "$NOTARY" | base64 --decode > "$RUNNER_TEMP/notary_key.json"

      # Catches the commonest setup mistake -- an "Apple Development" or
      # "Developer ID Installer" certificate -- with a clear message, rather
      # than as a Gatekeeper failure on a user's machine weeks later.
      - name: Check certificate type
        env: { PASS: "${{ secrets.MACOS_SIGN_P12_PASSWORD }}" }
        run: |
          subj=$(openssl pkcs12 -in "$RUNNER_TEMP/developer_id.p12" -nodes -passin env:PASS \
                 | openssl x509 -noout -subject)
          echo "certificate: $subj"
          case "$subj" in
            *"Developer ID Application"*) ;;
            *) echo "::error::not a Developer ID Application certificate: $subj"; exit 1 ;;
          esac

      - name: Build, sign and package
        env: { PASS: "${{ secrets.MACOS_SIGN_P12_PASSWORD }}" }
        run: |
          make fyne-ui-macos-universal-dmg \
            MACOS_SIGN_P12="$RUNNER_TEMP/developer_id.p12" \
            MACOS_SIGN_P12_PASSWORD="$PASS"

      - name: Notarize and staple
        run: |
          make macos-notarize-dmg MACOS_NOTARY_KEY="$RUNNER_TEMP/notary_key.json"

      # Gatekeeper's own verdict, on the artifact we are about to publish.
      - name: Verify Gatekeeper accepts it
        run: |
          DMG=$(ls Mercury-*-universal.dmg)
          spctl -a -t open --context context:primary-signature -v "$DMG"

      - name: Shred credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/developer_id.p12" "$RUNNER_TEMP/notary_key.json"

      - name: Upload signed .dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Mercury-*-universal.dmg

  # ---- Create GitHub release ----
  release:
    name: Create GitHub release
    needs: [sign, macos]
    # The macOS job is opt-in; without this the whole release is skipped when
    # it is, because a skipped dependency skips its dependents.
    if: ${{ always() && needs.sign.result == 'success' && needs.macos.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download signed zip
        uses: actions/download-artifact@v4
        with: { name: windows-signed }

      - name: Download signed installer
        if: ${{ inputs.build_installer }}
        uses: actions/download-artifact@v4
        with: { name: windows-installer-signed }

      - name: Download notarized .dmg
        if: ${{ inputs.build_macos }}
        uses: actions/download-artifact@v4
        with: { name: macos-dmg }

      - name: Create release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          ZIP=$(ls mercury-${{ inputs.version }}-w64-*.zip)
          ASSETS="./${ZIP}"
          # The installer is opt-in (build_installer); attach it only if present,
          # so a release without it still publishes cleanly.
          SETUP=$(ls Mercury_*_Setup.exe 2>/dev/null | head -1 || true)
          # Not `[ -n ... ] && ASSETS=...`: the runner shell has -e, so the
          # false test would end the step and no release would be created.
          if [ -n "$SETUP" ]; then ASSETS="$ASSETS ./${SETUP}"; fi
          DMG=$(ls Mercury-*-universal.dmg 2>/dev/null | head -1 || true)
          if [ -n "$DMG" ]; then ASSETS="$ASSETS ./${DMG}"; fi
          gh release create "v${{ inputs.version }}" $ASSETS \
            --repo Rhizomatica/mercury --target mercuryv2 --generate-notes \
            --title "Mercury ${{ inputs.version }}"
