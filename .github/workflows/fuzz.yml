# Mercury CI - libFuzzer campaigns over the untrusted-byte parsers (tests/fuzz).
#
# Non-blocking: runs weekly and on manual dispatch, never on PRs, so it adds
# nothing to the required gates. Any crash/leak/timeout reproducer is uploaded
# as an artifact; copy it into tests/fuzz/regressions/<target>/ when fixing,
# and `make -C tests/fuzz check` replays it from then on.
#
# The corpus each campaign grows is cached between runs, so campaigns build
# on each other; the committed corpus/ stays the minimal seed set.  Before it
# is saved, each target's corpus is minimised with -merge=1, so the cache (and
# the replay time of the check step) stays bounded.

name: Fuzz

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per target'
        required: false
        type: string
        default: '600'

# Nothing here writes to the repository: checkout, actions/cache and
# upload-artifact all work with a read-only token.
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Outer bound only.  The Fuzz step has its own, shorter limit: a step
    # timeout counts as a failure, so the reproducer upload still runs,
    # while a job timeout cancels the job and skips it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Caches unused for 7 days are evicted and the cron is exactly weekly, so
      # a delayed run may find none and start again from the committed seeds.
      # That costs only coverage, not correctness.
      - name: Restore grown corpus
        uses: actions/cache/restore@v4
        with:
          path: tests/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build targets, smoke run, replay saved regressions
        run: make -C tests/fuzz check
      - name: Fuzz
        timeout-minutes: 110
        env:
          SECS: ${{ inputs.seconds || '600' }}
        run: |
          cd tests/fuzz
          fail=0
          for t in $(make -s -f Makefile print-bins); do
            echo "::group::$t"
            mkdir -p "out/$t"
            # -timeout: report an input slower than 25 s as a timeout-*
            # reproducer (libFuzzer's default is 1200 s per input).
            ./$t -max_total_time="$SECS" -timeout=25 -artifact_prefix="out/$t/" \
                 -print_final_stats=1 "corpus/$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - name: Minimise grown corpus
        if: always()
        timeout-minutes: 10
        run: |
          cd tests/fuzz
          for t in $(make -s -f Makefile print-bins); do
            [ -x "./$t" ] && [ -d "corpus/$t" ] || continue
            rm -rf "merged/$t" && mkdir -p "merged/$t"
            # Keep the old corpus if the merge fails for any reason.
            if ./$t -merge=1 "merged/$t" "corpus/$t" > "merged/$t.log" 2>&1; then
              echo "$t: $(ls "corpus/$t" | wc -l) -> $(ls "merged/$t" | wc -l) units"
              rm -rf "corpus/$t" && mv "merged/$t" "corpus/$t"
            else
              echo "$t: merge failed, corpus kept"; tail -5 "merged/$t.log"
            fi
          done
      - name: Save grown corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tests/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers
          # The check step's smoke run has no -artifact_prefix, so its finds
          # land in tests/fuzz/ itself rather than out/.
          path: |
            tests/fuzz/out/
            tests/fuzz/crash-*
            tests/fuzz/leak-*
            tests/fuzz/timeout-*
            tests/fuzz/oom-*
