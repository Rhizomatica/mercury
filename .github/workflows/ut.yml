# Mercury CI Pipeline - Unit Tests
#
# Triggers:
#   - Automatically on every Pull Request
#   - Manually via workflow_dispatch
#   - Automatically on every push to mercuryv2
#
# Runs the unit tests on Linux amd64, again in a native i386 userland, and
# natively on macOS arm64.

name: UT

on:
  pull_request:
    branches: [mercuryv2]
  push:
    branches: [mercuryv2]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch | default = "mercuryv2"'
        required: false
        type: string
        default: 'mercuryv2'

jobs:
  unit-tests:
    name: Unit Tests (Linux amd64, Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential \
            git \
            openssh-client \
            libpulse-dev \
            libasound2-dev \
            libhamlib-dev \
            libsodium-dev \
            pkg-config

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: Rhizomatica/mercury
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || github.event.pull_request.head.sha || github.sha }}

      - name: Git Safe Directory
        run: git config --global --add safe.directory /__w/mercury/mercury

      - name: Run Unit Tests
        shell: bash
        run: make test

  # The same suite on 32-bit x86, in a real i386 Debian userland: i386 gcc,
  # x87 floating point, i386 packages -- what Debian's i386 buildd runs, so
  # we see its failures before a packager does.  Issue #299 is why: CI cross-
  # compiled arm64 and armhf but never RAN the tests on any 32-bit target, so
  # a PRNG declared `unsigned long` (32 bits on every ILP32 target) made two
  # MFSK tests measure a constant for years, and the first to notice was
  # Debian.
  #
  # Run with docker on the host rather than as a job `container:`, because
  # actions/checkout is a node action and node does not run in an i386 image.
  # linux32 gives the process the i386 personality, so `uname -m` says i686
  # instead of leaking the host kernel's x86_64 -- as on a real buildd.
  #
  # Pinned to ubuntu-24.04: on the ubuntu-26.04 image (ubuntu-latest since
  # Nov 2026) the `docker run` container cannot resolve DNS, even with
  # --network host, so apt-get fails before anything builds.
  unit-tests-i386:
    name: Unit Tests (Linux i386, Debian 13)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: Rhizomatica/mercury
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || github.event.pull_request.head.sha || github.sha }}

      - name: Run Unit Tests (i386)
        shell: bash
        run: |
          docker run --rm --platform linux/386 \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            i386/debian:trixie \
            linux32 bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates build-essential git pkg-config \
                libpulse-dev libasound2-dev libhamlib-dev libsodium-dev
              git config --global --add safe.directory /src
              echo "compiler target: $(gcc -dumpmachine), uname -m: $(uname -m)"
              make test
            '

  # The same suite natively on macOS arm64 (Apple Silicon, Apple clang, Apple
  # libm).  The repo ships macOS builds, and build.yml's macOS job already
  # catches link breaks like #200/#209, but only the tests catch the
  # platform's runtime differences: #520 was Apple's libm rounding sinf/cosf/
  # logf differently from glibc, and it failed `make test` on every Apple
  # Silicon Mac without any CI job noticing.
  #
  # No dependencies to install: the tests link only libpthread and libm, and
  # tests/Makefile already leaves out -lrt on Darwin.
  #
  # Plain checkout (no ssh-key), as in build.yml's macOS job: secrets are not
  # available to pull requests from forks, so that contributor is covered too.
  unit-tests-macos:
    name: Unit Tests (macOS arm64)
    runs-on: macos-15   # arm64, as build.yml's macOS job
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || github.event.pull_request.head.sha || github.sha }}

      - name: Toolchain
        run: |
          clang --version | head -1
          echo "dumpmachine: $(clang -dumpmachine)"

      - name: Run Unit Tests
        shell: bash
        run: make test
